<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Emmy Navigator 2026</title>

<!-- Home screen icon (iOS) -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emmy Navigator">

<!-- Home screen icon (Android/Chrome) + browser tab icon -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<meta name="theme-color" content="#0e0e12">
<style>
  :root {
    --bg: #0e0e12;
    --card: #17171d;
    --card-2: #1e1e26;
    --border: #2a2a33;
    --text: #f2f1ec;
    --muted: #9a99a6;
    --gold: #d4af37;
    --gold-dim: #8a7326;
    --green: #3fb950;
    --pink: #e0568c;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 640px; margin: 0 auto; padding: 0 14px 90px; }

  /* Title, overall progress, and Up Next scroll away normally — only the
     search/filter/tabs controls below stay pinned, so the checklist itself
     gets the full screen on small devices instead of being crowded out. */
  .hero { padding: 18px 0 4px; }

  header.controls-bar {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    padding: 10px 0 8px;
    border-bottom: 1px solid var(--border);
  }
  .title-row { display: flex; align-items: center; gap: 16px; }
  .title-row h1 { font-size: 26px; margin: 0; font-weight: 700; letter-spacing: -0.2px; }
  .title-row .sub { color: var(--gold); font-size: 15px; font-weight: 700; letter-spacing: 0.02em; margin-top: 3px; }

  .overall {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; margin-top: 14px;
  }
  .overall .stats { flex: 1; }
  .overall .stats .big { font-size: 28px; font-weight: 700; line-height: 1.1; }
  .overall .stats .lbl { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .overall .context { color: var(--muted); font-size: 11px; margin-top: 1px; }
  .overall .saved { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .overall .picks-summary { color: var(--muted); font-size: 11px; margin-top: 8px; }
  .overall .nom-note { color: var(--muted); font-size: 11px; margin-top: 3px; }

  .search-wrap { margin-top: 12px; position: relative; }
  .search-wrap input {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 10px 32px 10px 12px; font-size: 14px;
    outline: none;
  }
  .search-wrap input:focus { border-color: var(--gold-dim); }
  .search-clear {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 13px; cursor: pointer; display: none;
    width: 20px; height: 20px; border-radius: 50%; align-items: center; justify-content: center;
  }
  .search-clear.show { display: flex; }
  .search-clear:hover { color: var(--text); }

  .tabs {
    display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; padding-bottom: 2px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    white-space: nowrap; padding: 7px 13px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--muted); font-size: 12.5px; cursor: pointer; user-select: none;
  }
  .tab.active { background: var(--gold); color: #1a1608; border-color: var(--gold); font-weight: 600; }

  .cat-list { margin-top: 14px; display: flex; flex-direction: column; gap: 9px; }
  .cat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .cat-head { display: flex; align-items: center; gap: 11px; padding: 13px 14px; cursor: pointer; }
  .cat-icon { font-size: 19px; width: 26px; text-align: center; }
  .cat-info { flex: 1; min-width: 0; }
  .cat-info .name { font-size: 14.5px; font-weight: 600; line-height: 1.25; }
  .cat-info .grp { font-size: 11px; color: var(--muted); margin-top: 1px; display: flex; align-items: center; gap: 6px; }
  .cat-pick-dot { font-size: 10.5px; }
  .cat-count { font-size: 11.5px; color: var(--muted); margin-right: 2px; white-space: nowrap; }
  .chev { color: var(--muted); font-size: 12px; transition: transform .15s ease; }
  .cat-card.open .chev { transform: rotate(90deg); }

  .ring { flex-shrink: 0; }
  .ring circle.track { stroke: var(--border); fill: none; }
  .ring circle.prog { stroke: var(--gold); fill: none; stroke-linecap: round; transition: stroke-dashoffset .35s ease; }
  .ring.done circle.prog { stroke: var(--green); }

  .nom-list { border-top: 1px solid var(--border); }
  .nom-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 11px 14px; border-bottom: 1px solid var(--border);
  }
  .nom-row:last-child { border-bottom: none; }
  .nom-check {
    width: 21px; height: 21px; border-radius: 6px; border: 1.5px solid var(--muted);
    flex-shrink: 0; margin-top: 1px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    background: transparent; transition: background .15s ease, border-color .15s ease;
  }
  .nom-check.checked { background: var(--gold); border-color: var(--gold); color: #1a1608; font-weight: 700; }
  .nom-body { flex: 1; min-width: 0; }
  .nom-text { font-size: 13.8px; line-height: 1.35; }
  .nom-text.checked { color: var(--text); }
  .nom-text.won {
    border-left: 4px solid #ffd700;
    background: rgba(255, 215, 0, 0.10);
    padding: 3px 6px 3px 8px;
    border-radius: 3px;
    color: #ffd700;
    font-weight: 600;
  }
  .nom-text.won::before {
    content: "\2605 ";
    color: #ffd700;
    margin-right: 3px;
  }
  .nom-episode { font-size: 11.5px; color: var(--muted); font-style: italic; margin-top: 2px; }
  .nom-meta { display: flex; align-items: center; gap: 7px; margin-top: 6px; flex-wrap: wrap; }
  .nom-link {
    font-size: 11.5px; color: var(--gold); cursor: pointer; white-space: nowrap;
  }
  .stream-badge {
    font-size: 10.5px; color: var(--muted); background: var(--card-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px;
  }

  .pick-btn {
    font-size: 13px; line-height: 1; padding: 4px 7px; border-radius: 999px;
    background: var(--card-2); border: 1px solid var(--border); cursor: pointer;
    opacity: .55; filter: grayscale(1); transition: opacity .15s ease, filter .15s ease, border-color .15s ease, background .15s ease;
  }
  .pick-btn.active { opacity: 1; filter: none; }
  .pick-btn.active.predicted { border-color: var(--gold); background: rgba(212,175,55,.12); }
  .pick-btn.active.wanted { border-color: var(--pink); background: rgba(224,86,140,.12); }

  /* toast */
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    background: var(--gold); color: #1a1608; font-weight: 700; font-size: 13px;
    padding: 9px 18px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease; z-index: 100;
    box-shadow: 0 6px 20px rgba(0,0,0,.4);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* detail modal */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50;
    display: none; align-items: flex-end; justify-content: center;
  }
  #overlay.show { display: flex; }
  #detail {
    background: var(--bg); border: 1px solid var(--border); border-bottom: none;
    border-radius: 18px 18px 0 0; width: 100%; max-width: 640px;
    max-height: 88vh; overflow-y: auto; padding: 18px 16px 26px;
  }
  .detail-head { display: flex; align-items: flex-start; gap: 10px; }
  .detail-head h2 { margin: 0; font-size: 19px; flex: 1; }
  .detail-close {
    background: var(--card); border: 1px solid var(--border); color: var(--muted);
    width: 30px; height: 30px; border-radius: 50%; font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .detail-sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .stream-section { margin-top: 14px; }
  .stream-section .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .provider-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .provider-chip {
    font-size: 12px; background: var(--card-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 11px;
  }
  .stream-empty { font-size: 12.5px; color: var(--muted); }
  .stream-link { display: inline-block; margin-top: 8px; font-size: 12.5px; color: var(--gold); }

  .mark-all-btn {
    width: 100%; margin-top: 16px; background: var(--gold); color: #1a1608;
    border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  .mark-all-btn.done { background: var(--green); color: #08210c; }

  .detail-noms { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  .detail-nom-row {
    display: flex; align-items: flex-start; gap: 10px; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  }
  .detail-nom-row .txt { flex: 1; font-size: 13px; }
  .detail-nom-row .cat {
    color: var(--gold); font-size: 13px; font-weight: 700;
    margin-bottom: 4px; display: flex; align-items: center; gap: 5px;
  }

  .empty-state { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 20px; }

  /* search highlighting */
  mark.hl { background: rgba(212,175,55,.32); color: inherit; border-radius: 3px; padding: 0 1px; }

  /* countdown */
  .overall .countdown { color: var(--gold); font-size: 11.5px; font-weight: 600; margin-top: 4px; }

  /* filter pills (Focus Mode / Hide completed) */
  .filter-row { display: flex; gap: 6px; margin-top: 10px; }
  .filter-pill {
    padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--border);
    color: var(--muted); font-size: 12px; cursor: pointer; user-select: none;
  }
  .filter-pill.active { background: rgba(212,175,55,.15); border-color: var(--gold); color: var(--gold); font-weight: 600; }
  .hidden-note { color: var(--muted); font-size: 11.5px; text-align: center; padding: 9px 14px; }

  /* footer / about */
  .app-footer { text-align: center; padding: 24px 0 12px; }
  .footer-link {
    color: var(--muted); font-size: 11.5px; cursor: pointer;
    text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 2px;
  }
  .footer-link:hover { color: var(--text); }
  .about-body { margin-top: 16px; }
  .about-body p { font-size: 13px; line-height: 1.55; color: var(--text); margin: 0 0 16px; }
  .about-section-lbl {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .04em; margin-bottom: 8px;
  }
  .tmdb-credit {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;
  }
  .tmdb-logo { height: 11px; width: auto; max-width: 100%; display: block; }
  .tmdb-disclaimer { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin: 0 0 16px; }
  .about-meta { font-size: 11.5px; color: var(--muted); line-height: 1.6; }

  /* posters */
  .poster-thumb { border-radius: 6px; object-fit: cover; background: var(--card-2); display: block; flex-shrink: 0; }
  .poster-thumb.sm { width: 34px; height: 49px; }
  .poster-thumb.lg { width: 72px; height: 104px; border-radius: 8px; }
  .poster-thumb.xl { width: 60px; height: 87px; border-radius: 8px; }
  .poster-placeholder { display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--muted); border: 1px solid var(--border); }

  /* Up Next */
  .upnext-section { margin-top: 14px; }
  .upnext-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .upnext-title { font-size: 14px; font-weight: 700; }
  .upnext-manage { font-size: 11.5px; color: var(--gold); cursor: pointer; white-space: nowrap; }
  .upnext-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .upnext-scroll::-webkit-scrollbar { display: none; }
  .upnext-card { flex-shrink: 0; width: 84px; cursor: pointer; }
  .upnext-card-title {
    font-size: 11.5px; font-weight: 600; margin-top: 5px; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .upnext-card-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .upnext-onservice { color: var(--green); }
  .upnext-empty { color: var(--muted); font-size: 12.5px; padding: 10px 2px; }

  /* streaming services modal */
  .service-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .service-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--border);
    font-size: 13px; cursor: pointer; user-select: none;
  }
  .service-chip .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255,255,255,.25); }
  .service-chip.active { font-weight: 600; }
  .service-chip .chip-remove {
    margin-left: 2px; color: var(--muted); font-size: 11px; line-height: 1;
    padding: 2px; border-radius: 50%;
  }
  .service-chip .chip-remove:hover { color: var(--text); }

  /* completion celebration */
  #confettiLayer { position: fixed; inset: 0; pointer-events: none; z-index: 200; overflow: hidden; }
  .confetti-piece {
    position: absolute; top: -20px; width: 8px; height: 8px; border-radius: 2px;
    animation-name: confettiFall; animation-timing-function: ease-in; animation-fill-mode: forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(540deg); opacity: 0; }
  }
  .cat-card.celebrate { animation: cardFlash .9s ease; }
  @keyframes cardFlash {
    0% { box-shadow: 0 0 0 0 rgba(212,175,55,0); }
    30% { box-shadow: 0 0 0 4px rgba(212,175,55,.55); }
    100% { box-shadow: 0 0 0 0 rgba(212,175,55,0); }
  }

  /* ---------- Emmy Report ---------- */
  .report-view { padding: 4px 0 40px; }
  .report-hero {
    background: linear-gradient(135deg, rgba(212,175,55,.14), rgba(212,175,55,.03));
    border: 1px solid var(--gold-dim); border-radius: var(--radius);
    padding: 18px 20px; margin-bottom: 18px;
  }
  .report-hero h2 { margin: 0 0 4px; font-size: 20px; color: var(--gold); }
  .report-hero .sub { color: var(--muted); font-size: 13px; }
  .report-stats { display: flex; gap: 22px; margin-top: 14px; flex-wrap: wrap; }
  .report-stat .n { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1; }
  .report-stat .l { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
  .report-panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px;
  }
  .report-panel h3 { margin: 0 0 3px; font-size: 15px; color: var(--text); }
  .report-panel .panel-sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .lb-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank { width: 22px; font-size: 12px; color: var(--muted); text-align: right; flex: none; }
  .lb-name { flex: 1; min-width: 0; font-size: 13.8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-net { font-size: 11.5px; color: var(--muted); flex: none; }
  .lb-count { font-size: 13px; font-weight: 700; color: var(--gold); min-width: 26px; text-align: right; flex: none; }
  .lb-bar { height: 4px; border-radius: 2px; background: var(--gold); opacity: .65; flex: none; }
  .lb-top .lb-name { color: var(--gold); font-weight: 600; }
  .net-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 9px; }
  .net-card { background: var(--card-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .net-card .nm { font-size: 12.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .net-card .ct { font-size: 19px; font-weight: 700; color: var(--gold); }
  .ind-row { display: flex; align-items: baseline; gap: 9px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .ind-row:last-child { border-bottom: none; }
  .ind-ct { font-size: 12px; font-weight: 700; color: var(--gold); flex: none; min-width: 16px; }
  .ind-nm { font-size: 13.5px; flex: none; }
  .ind-cr { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .report-foot { font-size: 11.5px; color: var(--muted); text-align: center; padding: 6px 10px; line-height: 1.5; }

  .sp-item { padding: 11px 0; border-bottom: 1px solid var(--border); }
  .sp-item:last-child { border-bottom: none; }
  .sp-award { font-size: 13.8px; color: var(--text); font-weight: 600; }
  .sp-kind {
    display: inline-block; font-size: 10.5px; color: var(--gold);
    border: 1px solid var(--gold-dim); border-radius: 999px;
    padding: 1px 7px; margin-left: 7px; vertical-align: 1px; white-space: nowrap;
  }
  .sp-note { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
  .sp-win { display: flex; gap: 7px; align-items: baseline; margin-top: 7px; padding-left: 10px; border-left: 2px solid var(--gold-dim); }
  .sp-win .w-main { font-size: 13px; color: var(--text); }
  .sp-win .w-sub { font-size: 11.5px; color: var(--muted); }

  .lb-click { cursor: pointer; border-radius: 6px; margin: 0 -6px; padding-left: 6px; padding-right: 6px; }
  .lb-click:hover { background: var(--card-2); }
  .lb-chev { color: var(--muted); font-size: 12px; }
  .net-block { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; background: var(--card-2); }
  .net-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; }
  .net-head:hover { background: rgba(212,175,55,.06); }
  .net-ct { font-size: 16px; font-weight: 700; color: var(--gold); min-width: 24px; }
  .net-nm { flex: 1; min-width: 0; font-size: 13.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .net-meta { font-size: 11.5px; color: var(--muted); flex: none; }
  .net-chev { color: var(--muted); font-size: 11px; transition: transform .15s ease; flex: none; }
  .net-head.open .net-chev { transform: rotate(180deg); }
  .net-body { display: none; padding: 2px 12px 10px; }
  .net-body.open { display: block; }
  .ns-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; }
  .ns-click { cursor: pointer; }
  .ns-click:hover { background: var(--card); }
  .ns-name { flex: 1; min-width: 0; font-size: 12.8px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ns-click .ns-name { color: var(--text); }
  .ns-ct { font-size: 12px; font-weight: 700; color: var(--gold); flex: none; }

  .ind-row { align-items: flex-start; gap: 10px; padding: 9px 0; }
  .ind-ct { padding-top: 1px; }
  .ind-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .ind-nm { font-size: 13.5px; color: var(--text); }
  .ind-cr { font-size: 11.5px; color: var(--muted); white-space: normal; }
  .ind-shows { font-size: 11.5px; margin-top: 1px; line-height: 1.5; }
  .ind-show { color: var(--gold); opacity: .85; }
  .ind-click { cursor: pointer; text-decoration: underline; text-decoration-color: var(--gold-dim); text-underline-offset: 2px; }
  .ind-click:hover { opacity: 1; }
  .ind-sep { color: var(--muted); margin: 0 6px; }

  .nom-character { font-size: 11.8px; color: var(--muted); margin-top: 2px; font-style: italic; }
  .nom-text.won + .nom-character { color: var(--gold); opacity: .8; font-style: normal; }

  .detail-group-hdr {
    font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--muted); margin: 14px 0 6px; padding-bottom: 5px;
    border-bottom: 1px solid var(--border);
  }
  .detail-group-hdr:first-child { margin-top: 4px; }
  .detail-group-hdr.won-hdr { color: var(--gold); border-bottom-color: var(--gold-dim); }
  .detail-wins { color: var(--gold); font-weight: 600; }

  /* View switch — deliberately NOT pill-shaped, so it reads as a different

    color: #9a99a6;

  .mode-seg.active {

  .mode-seg.active .seg-ico { filter: none; }
  .mode-seg .seg-count {
    font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 999px;

const STORAGE_KEY = "emmyTracker2026:v2";

/* ---------- state ---------- */
// entries: { "catId#idx": true/false }             -> watched
// picks:   { catId: { predicted: idx|null, wanted: idx|null } }  -> per-category, single choice each
let state = { entries: {}, picks: {}, updatedAt: null };
(function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object") state = Object.assign(state, parsed);
    }
  } catch (e) { /* ignore corrupt storage */ }
})();

function saveState() {
  state.updatedAt = new Date().toISOString();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  renderSavedAt();
  showToast("✓ Saved");
}

function entryKey(catId, idx) { return catId + "#" + idx; }
function isChecked(catId, idx) { return !!state.entries[entryKey(catId, idx)]; }
function setChecked(catId, idx, val) { state.entries[entryKey(catId, idx)] = !!val; }

function getPredicted(catId) { return state.picks[catId] ? state.picks[catId].predicted : null; }
function getWanted(catId) { return state.picks[catId] ? state.picks[catId].wanted : null; }
function setPredicted(catId, idx) {
  if (!state.picks[catId]) state.picks[catId] = { predicted: null, wanted: null };
  state.picks[catId].predicted = state.picks[catId].predicted === idx ? null : idx;
  saveState();
}
function setWanted(catId, idx) {
  if (!state.picks[catId]) state.picks[catId] = { predicted: null, wanted: null };
  state.picks[catId].wanted = state.picks[catId].wanted === idx ? null : idx;
  saveState();
}

/* ---------- extractFilm / cascade ---------- */
function extractFilm(nomineeStr) {
  if (!nomineeStr) return null;
  // "Song" — Title
  let m = nomineeStr.match(/^"[^"]+"\s*—\s*(.+)$/);
  if (m) return m[1].trim();
  // Person — Title  (only split on the LAST em dash so titles containing "—" survive)
  const lastDash = nomineeStr.lastIndexOf("—");
  if (lastDash !== -1) {
    const left = nomineeStr.slice(0, lastDash).trim();
    const right = nomineeStr.slice(lastDash + 1).trim();
    if (left && right) return right;
  }
  // bare title
  return nomineeStr.trim();
}

// showTitle -> [{catId, idx}]
let SHOW_INDEX = {};
function buildShowIndex() {
  SHOW_INDEX = {};
  CATEGORIES.forEach(cat => {
    cat.nominees.forEach((n, idx) => {
      const film = extractFilm(n.display);
      if (!film) return;
      if (!SHOW_INDEX[film]) SHOW_INDEX[film] = [];
      SHOW_INDEX[film].push({ catId: cat.id, idx });
    });
  });
}
buildShowIndex();

function cascadeFilm(title, checked) {
  const refs = SHOW_INDEX[title] || [];
  refs.forEach(r => setChecked(r.catId, r.idx, checked));
  saveState();
  renderAll();
}

/* ---------- streaming ---------- */
const streamCache = {};
const streamInFlight = {};
function fetchStreaming(title) {
  if (streamCache[title]) return Promise.resolve(streamCache[title]);
  if (streamInFlight[title]) return streamInFlight[title];
  const p = fetch("/.netlify/functions/streaming?title=" + encodeURIComponent(title))
    .then(r => r.json())
    .then(data => {
      // Collapse tier/variant provider names (e.g. "Netflix Standard with Ads")
      // down to their canonical brand label so chips don't duplicate.
      data.flatrate = canonicalizeProviders(data.flatrate);
      data.rent = canonicalizeProviders(data.rent);
      data.buy = canonicalizeProviders(data.buy);
      streamCache[title] = data; delete streamInFlight[title]; return data;
    })
    .catch(() => { const empty = { flatrate: [], rent: [], buy: [], link: null }; streamCache[title] = empty; delete streamInFlight[title]; return empty; });
  streamInFlight[title] = p;
  return p;
}

function prefetchCategory(cat) {
  const titles = new Set(cat.nominees.map(n => extractFilm(n.display)).filter(Boolean));
  titles.forEach(t => {
    fetchStreaming(t).then(() => paintStreamData(cat.id, t));
  });
}

function paintStreamData(catId, title) {
  const data = streamCache[title];
  if (!data) return;
  document.querySelectorAll('.nom-row').forEach(row => {
    if (row.dataset.cat === catId && row.dataset.film === title) {
      const slot = row.querySelector('.stream-slot');
      if (slot) slot.innerHTML = streamBadgeHtml(data);
      const posterSlot = row.querySelector('.poster-slot');
      if (posterSlot) posterSlot.innerHTML = posterHtmlFor(title, "sm");
    }
  });
}

function posterHtmlFor(title, sizeClass) {
  const data = streamCache[title];
  if (data && data.poster) {
    return '<img class="poster-thumb ' + sizeClass + '" src="' + escapeHtml(data.poster) + '" alt="" loading="lazy">';
  }
  return '<div class="poster-thumb ' + sizeClass + ' poster-placeholder">🎬</div>';
}

function streamBadgeHtml(data) {
  if (!data) return "";
  if (data.flatrate && data.flatrate.length) return '<span class="stream-badge">▶ ' + escapeHtml(data.flatrate[0]) + (data.flatrate.length > 1 ? " +" + (data.flatrate.length - 1) : "") + '</span>';
  if (data.rent && data.rent.length) return '<span class="stream-badge">$ Rent</span>';
  if (data.buy && data.buy.length) return '<span class="stream-badge">$ Buy</span>';
  return '<span class="stream-badge">No streaming data</span>';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Wraps every case-insensitive occurrence of the current search query in
// <mark>, so results visually pop instead of you having to re-read every row.
function highlightText(text, query) {
  const safe = escapeHtml(text);
  if (!query) return safe;
  const q = query.trim();
  if (!q) return safe;
  const escapedQuery = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = new RegExp("(" + escapedQuery + ")", "ig");
  return safe.replace(re, "<mark class=\"hl\">$1</mark>");
}

const HIDE_COMPLETED_KEY = "emmyTracker2026:hideCompleted";

const SERVICES = [
  { id: "netflix", label: "Netflix", match: ["netflix"], color: "#E50914" },
  { id: "max", label: "HBO Max", match: ["max", "hbo max"], color: "#000000" },

];
function hexToRgba(hex, alpha) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
}
// For active-state borders/tints (not the brand dot), swap colors too dark to
// read against this app's near-black UI for a light neutral instead.
function activeAccent(hex) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return luminance < 40 ? "#c8c8cf" : hex;
}

function getSelectedServiceObjs() {
  return SERVICES.concat(customServices).filter(s => selectedServiceIds.includes(s.id));
}

// Full TMDB provider catalog, fetched once and cached in memory for the
// "search for another service" box in the services picker.
let providerCatalog = null;
let providerCatalogPromise = null;
function fetchProviderCatalog() {
  if (providerCatalog) return Promise.resolve(providerCatalog);
  if (providerCatalogPromise) return providerCatalogPromise;
  providerCatalogPromise = fetch("/.netlify/functions/providers")
    .then(r => r.json())
    .then(list => { providerCatalog = Array.isArray(list) ? list : []; return providerCatalog; })
    .catch(() => { providerCatalog = []; return providerCatalog; });
  return providerCatalogPromise;
}
function providerMatchesService(providerName, service) {
  const p = providerName.toLowerCase();
  // The backend already collapses every provider to one canonical label, and
  // those labels are exactly the SERVICES labels — so an exact match is the
  // reliable path. Substring is only the fallback for custom services added
  // from the TMDB catalog. It has to stay a fallback: "max" is a substring of
  // "Cinemax" and "amazon" is a substring of every "… Amazon Channel", so
  // leading with it silently mislabels providers.
  if (p === String(service.label || "").toLowerCase()) return true;
  return service.match.some(m => p === m || p.startsWith(m + " "));
}
function canonicalizeProviders(list) {
  if (!list || !list.length) return [];
  const seen = new Set();
  const out = [];
  list.forEach(raw => {
    const match = SERVICES.find(s => providerMatchesService(raw, s));
    const label = match ? match.label : raw;
    if (!seen.has(label)) { seen.add(label); out.push(label); }
  });
  return out;
}

function catProgress(cat) {
  let done = 0;
  cat.nominees.forEach((n, idx) => { if (isChecked(cat.id, idx)) done++; });
  return { done, total: cat.nominees.length };
}

function overallProgress() {
  let done = 0, total = 0;
  CATEGORIES.forEach(cat => {
    cat.nominees.forEach((n, idx) => { total++; if (isChecked(cat.id, idx)) done++; });
  });
  return { done, total };
}

// Headline metric: unique shows with at least one checked nomination, out of
// all uniquely nominated shows. Nomination count is a poor proxy for "have I
// watched this" since one heavily-nominated show can carry 20+ nominations
// while most carry 1 — this tracks what you actually watch, show by show.
function showsWatchedProgress() {
  const titles = Object.keys(SHOW_INDEX);
  let watched = 0;
  titles.forEach(title => {
    if (SHOW_INDEX[title].some(r => isChecked(r.catId, r.idx))) watched++;
  });
  return { watched, total: titles.length };
}

function picksProgress() {
  let predicted = 0, wanted = 0;
  Object.keys(state.picks).forEach(catId => {
    const p = state.picks[catId];
    if (p && p.predicted != null) predicted++;
    if (p && p.wanted != null) wanted++;
  });
  return { predicted, wanted };
}

function ringSvg(done, total, size, r, strokeWidth, extraClass) {
  const c = 2 * Math.PI * r;
  const pct = total > 0 ? done / total : 0;
  const offset = c * (1 - pct);
  const doneClass = total > 0 && done === total ? " done" : "";
  return '<svg class="ring' + doneClass + (extraClass ? " " + extraClass : "") + '" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
    '<circle class="track" cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" stroke-width="' + strokeWidth + '"></circle>' +
    '<circle class="prog" cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" stroke-width="' + strokeWidth + '" stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + offset.toFixed(2) + '" transform="rotate(-90 ' + size/2 + ' ' + size/2 + ')"></circle>' +
    '</svg>';
}

function matchesSearch(cat) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  if (cat.label.toLowerCase().includes(q)) return true;
  return cat.nominees.some(n => n.display.toLowerCase().includes(q) || (n.episode && n.episode.toLowerCase().includes(q)));
}

function filteredCategories() {
  return CATEGORIES.filter(cat => {
    if (focusMode && FOCUS_HIDDEN_TYPES.includes(cat.type)) return false;
    if (activeTab !== "All" && cat.type !== activeTab) return false;
    if (hideCompleted) {
      const { done, total } = catProgress(cat);
      if (total > 0 && done === total) return false;
    }
    return matchesSearch(cat);
  });
}

function pickButtonsHtml(catId, idx) {
  const predicted = getPredicted(catId) === idx;
  const wanted = getWanted(catId) === idx;
  return '<span class="pick-btn' + (predicted ? " active predicted" : "") + '" data-pick="predicted" data-cat="' + escapeHtml(catId) + '" data-idx="' + idx + '" title="Predicted to win">🔮</span>' +
         '<span class="pick-btn' + (wanted ? " active wanted" : "") + '" data-pick="wanted" data-cat="' + escapeHtml(catId) + '" data-idx="' + idx + '" title="Who I want to win">❤️</span>';
}

/* ---------- Up Next ---------- */
const upNextRequested = new Set();

function computeUpNextCandidates(limit) {
  const shows = Object.keys(SHOW_INDEX).map(title => {
    const refs = SHOW_INDEX[title];
    const total = refs.length;
    const watched = refs.filter(r => isChecked(r.catId, r.idx)).length;
    return { title, total, watched, unwatched: total - watched };
  }).filter(s => s.unwatched > 0);
  shows.sort((a, b) => b.total - a.total || a.title.localeCompare(b.title));
  return shows.slice(0, limit);
}

function renderUpNext() {
  const scroll = document.getElementById("upnextScroll");
  if (!scroll) return;
  const candidates = computeUpNextCandidates(12);

  // Bounded prefetch: only ever attach one resolve-listener per title, so
  // repeated renders never re-trigger (fetchStreaming itself is cached, but
  // without this guard the .then callback would keep re-firing forever).
  candidates.forEach(c => {
    if (!upNextRequested.has(c.title)) {
      upNextRequested.add(c.title);
      fetchStreaming(c.title).then(() => renderUpNext());
    }
  });

  const services = getSelectedServiceObjs();
  const ranked = candidates.map(c => {
    const data = streamCache[c.title];
    const onService = services.length > 0 && !!data && !!data.flatrate &&
      data.flatrate.some(p => services.some(s => providerMatchesService(p, s)));
    return Object.assign({}, c, { onService });
  });
  ranked.sort((a, b) => (b.onService - a.onService) || (b.total - a.total));

  if (ranked.length === 0) {
    scroll.innerHTML = '<div class="upnext-empty">You\'re caught up — nothing left to watch 🎉</div>';
    return;
  }

  scroll.innerHTML = ranked.map(c => {
    return '<div class="upnext-card" data-show="' + escapeHtml(c.title) + '">' +
      posterHtmlFor(c.title, "lg") +
      '<div class="upnext-card-title">' + escapeHtml(c.title) + '</div>' +
      '<div class="upnext-card-sub">' + c.unwatched + ' of ' + c.total + ' left' +
        (c.onService ? ' · <span class="upnext-onservice">on your services</span>' : '') +
      '</div>' +
    '</div>';
  }).join("");

  scroll.querySelectorAll(".upnext-card").forEach(el => {
    el.addEventListener("click", () => openDetail(el.getAttribute("data-show")));
  });
}

/* ---------- countdown ---------- */
const CEREMONY_DATE = new Date("2026-09-14T20:00:00-04:00"); // 78th Emmys, NBC/Peacock
function renderCountdown() {

/* ---------- completion celebrations ---------- */
let completionSnapshot = {};
let initialRenderDone = false;

const CONFETTI_COLORS = ["#d4af37", "#e0568c", "#3fb950", "#f2f1ec", "#8a7326"];
function burstConfetti(count) {
  const layer = document.getElementById("confettiLayer");
  if (!layer) return;
  for (let i = 0; i < count; i++) {
    const piece = document.createElement("span");
    piece.className = "confetti-piece";
    piece.style.left = (Math.random() * 100) + "vw";
    piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    piece.style.animationDelay = (Math.random() * 0.3) + "s";
    piece.style.animationDuration = (1 + Math.random() * 0.6) + "s";
    layer.appendChild(piece);
    setTimeout(() => piece.remove(), 2000);
  }
}

function celebrateCategory(catId) {
  document.querySelectorAll(".cat-card").forEach(card => {
    if (card.dataset.catCard === catId) {
      card.classList.add("celebrate");
      setTimeout(() => card.classList.remove("celebrate"), 900);
    }
  });
  burstConfetti(20);
}

function checkCategoryCompletions() {
  CATEGORIES.forEach(cat => {
    const { done, total } = catProgress(cat);
    const isDone = total > 0 && done === total;
    const wasDone = completionSnapshot[cat.id];
    if (isDone && wasDone === false) celebrateCategory(cat.id);
    completionSnapshot[cat.id] = isDone;
  });
}

function milestoneMessage(t) {
  if (t === 100) return "🏆 All caught up — every nomination watched!";
  return "🎉 " + t + "% of nominations watched!";
}

function checkOverallMilestones(silent) {
  const { done, total } = overallProgress();
  if (total === 0) return;
  const pct = (done / total) * 100;
  const thresholds = [25, 50, 75, 100];
  let shown = [];
  try { shown = JSON.parse(localStorage.getItem(MILESTONE_KEY) || "[]"); } catch (e) {}
  let changed = false;
  thresholds.forEach(t => {
    if (pct >= t && !shown.includes(t)) {
      shown.push(t);
      changed = true;
      if (!silent) {
        showToast(milestoneMessage(t), 2400);
        if (t === 100) burstConfetti(60);
      }
    }
  });
  if (changed) {
    try { localStorage.setItem(MILESTONE_KEY, JSON.stringify(shown)); } catch (e) {}
  }
}

/* ---------- render ---------- */
function renderTabs() {
  const wrap = document.getElementById("tabs");
  let visibleTypes = TYPES.filter(t => t !== "Other" || CATEGORIES.some(c => c.type === "Other"));
  if (focusMode) visibleTypes = visibleTypes.filter(t => !FOCUS_HIDDEN_TYPES.includes(t));
  wrap.innerHTML = visibleTypes.map(t => {
    const count = t === "All"
      ? CATEGORIES.filter(c => !focusMode || !FOCUS_HIDDEN_TYPES.includes(c.type)).length
      : CATEGORIES.filter(c => c.type === t).length;
    return '<div class="tab' + (activeTab === t ? " active" : "") + '" data-tab="' + escapeHtml(t) + '">' + TYPE_LABELS[t] + ' (' + count + ')</div>';
  }).join("");
  wrap.querySelectorAll(".tab").forEach(el => {
    el.addEventListener("click", () => { activeTab = el.getAttribute("data-tab"); renderAll(); });
  });
}

function renderFilterPills() {
  const focusBtn = document.getElementById("focusModeToggle");
  const hideBtn = document.getElementById("hideCompletedToggle");
  if (focusBtn) focusBtn.classList.toggle("active", focusMode);
  if (hideBtn) hideBtn.classList.toggle("active", hideCompleted);
}

function renderOverall() {
  const { watched, total: totalShows } = showsWatchedProgress();
  document.getElementById("overallCount").textContent = String(watched);
  document.getElementById("overallContext").textContent = totalShows + " nominated overall";
  const { done, total } = overallProgress();
  document.getElementById("nomNote").textContent = done + " / " + total + " nominations checked";
  const { predicted, wanted } = picksProgress();
  document.getElementById("picksSummary").textContent = "🔮 " + predicted + " / " + CATEGORIES.length + " predicted · ❤️ " + wanted + " / " + CATEGORIES.length + " picked";
  renderSavedAt();
}

function renderCatList() {
  const cats = filteredCategories();
  const listEl = document.getElementById("catList");
  const emptyEl = document.getElementById("emptyState");
  if (cats.length === 0) {
    listEl.innerHTML = "";
    emptyEl.style.display = "block";
    return;
  }
  emptyEl.style.display = "none";

  listEl.innerHTML = cats.map(cat => {
    const { done, total } = catProgress(cat);
    const isOpen = openCats.has(cat.id);
    const ring = ringSvg(done, total, 34, 14, 3.5);
    const hasPredicted = getPredicted(cat.id) != null;
    const hasWanted = getWanted(cat.id) != null;
    const dots = (hasPredicted ? '<span class="cat-pick-dot">🔮</span>' : '') + (hasWanted ? '<span class="cat-pick-dot">❤️</span>' : '');
    let nomHtml = "";
    if (isOpen) {
      const visibleNoms = cat.nominees
        .map((n, idx) => ({ n, idx }))
        .filter(({ idx }) => !(hideCompleted && isChecked(cat.id, idx)));
      const hiddenCount = cat.nominees.length - visibleNoms.length;
      const rowsHtml = visibleNoms.map(({ n, idx }) => {
        const checked = isChecked(cat.id, idx);
        const film = extractFilm(n.display);
        const noms = SHOW_INDEX[film] || [];
        const showLink = noms.length > 1 ? '<span class="nom-link" data-show="' + escapeHtml(film) + '">' + noms.length + ' noms &rsaquo;</span>' : "";
        const cached = streamCache[film];
        const badge = cached ? streamBadgeHtml(cached) : "";
        const charHtml = n.character ? '<div class="nom-character">as ' + highlightText(n.character, searchQuery) + '</div>' : "";
        const episodeHtml = n.episode ? '<div class="nom-episode">"' + highlightText(n.episode, searchQuery) + '"</div>' : "";
        return '<div class="nom-row" data-cat="' + escapeHtml(cat.id) + '" data-idx="' + idx + '" data-film="' + escapeHtml(film) + '">' +
          '<div class="nom-check' + (checked ? " checked" : "") + '" data-cat="' + escapeHtml(cat.id) + '" data-idx="' + idx + '">' + (checked ? "✓" : "") + '</div>' +
          '<span class="poster-slot">' + posterHtmlFor(film, "sm") + '</span>' +
          '<div class="nom-body">' +
            '<div class="nom-text' + (checked ? " checked" : "") + (n.won ? " won" : "") + '">' + highlightText(n.display, searchQuery) + '</div>' +
            charHtml + episodeHtml +
            '<div class="nom-meta">' + pickButtonsHtml(cat.id, idx) + '<span class="stream-slot">' + badge + '</span>' + showLink + '</div>' +
          '</div>' +
        '</div>';
      }).join("");
      const hiddenNote = hiddenCount > 0 ? '<div class="hidden-note">' + hiddenCount + ' watched (hidden)</div>' : "";
      nomHtml = '<div class="nom-list">' + rowsHtml + hiddenNote + '</div>';
    }
    return '<div class="cat-card' + (isOpen ? " open" : "") + '" data-cat-card="' + escapeHtml(cat.id) + '">' +
      '<div class="cat-head" data-toggle="' + escapeHtml(cat.id) + '">' +
        '<div class="cat-icon">' + cat.icon + '</div>' +
        '<div class="cat-info"><div class="name">' + highlightText(cat.label, searchQuery) + '</div><div class="grp">' + GROUP_LABELS[cat.group] + dots + '</div></div>' +
        '<div class="cat-count">' + done + '/' + total + '</div>' +
        ring +
        '<div class="chev">▸</div>' +
      '</div>' +
      nomHtml +
    '</div>';
  }).join("");

  // wire up interactions
  listEl.querySelectorAll("[data-toggle]").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.getAttribute("data-toggle");
      if (openCats.has(id)) {
        openCats.delete(id);
      } else {
        openCats.add(id);
        const cat = CATEGORIES.find(c => c.id === id);
        if (cat) prefetchCategory(cat);
      }
      renderAll();
    });
  });

  listEl.querySelectorAll(".nom-check").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const catId = el.getAttribute("data-cat");
      const idx = parseInt(el.getAttribute("data-idx"), 10);
      const cat = CATEGORIES.find(c => c.id === catId);
      const film = extractFilm(cat.nominees[idx].display);
      const newVal = !isChecked(catId, idx);
      cascadeFilm(film, newVal);
    });
  });

  listEl.querySelectorAll(".nom-link").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      openDetail(el.getAttribute("data-show"));
    });
  });

  listEl.querySelectorAll(".pick-btn").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const catId = el.getAttribute("data-cat");
      const idx = parseInt(el.getAttribute("data-idx"), 10);
      const type = el.getAttribute("data-pick");
      if (type === "predicted") setPredicted(catId, idx); else setWanted(catId, idx);
      renderAll();
    });
  });
}

function renderAll() {
  renderTabs();
  renderFilterPills();
  renderOverall();
  renderCountdown();
  renderCatList();
  renderUpNext();
  if (!initialRenderDone) {
    CATEGORIES.forEach(cat => {
      const { done, total } = catProgress(cat);
      completionSnapshot[cat.id] = total > 0 && done === total;
    });
    checkOverallMilestones(true);
    initialRenderDone = true;
  } else {
    checkCategoryCompletions();
    checkOverallMilestones(false);
  }
}

/* ---------- detail view ---------- */
function openDetail(showTitle) {
  const rawRefs = SHOW_INDEX[showTitle] || [];
  // Winners first, then the remaining nominations. Original order is preserved
  // inside each group, so categories still read in their normal sequence.
  const refs = rawRefs.slice().sort(function (a, b) {
    const aWon = (CATEGORIES.find(c => c.id === a.catId).nominees[a.idx].won) ? 1 : 0;
    const bWon = (CATEGORIES.find(c => c.id === b.catId).nominees[b.idx].won) ? 1 : 0;
    return bWon - aWon;
  });
  const winCount = refs.filter(function (r) {
    return CATEGORIES.find(c => c.id === r.catId).nominees[r.idx].won;
  }).length;
  const overlay = document.getElementById("overlay");
  const detail = document.getElementById("detail");

  function render() {
    const allChecked = refs.length > 0 && refs.every(r => isChecked(r.catId, r.idx));
    let emittedWinHdr = false, emittedNomHdr = false;
    const rowsHtml = refs.map(r => {
      const cat = CATEGORIES.find(c => c.id === r.catId);
      const n = cat.nominees[r.idx];
      const checked = isChecked(r.catId, r.idx);
      let hdr = "";
      if (n.won && !emittedWinHdr) {
        emittedWinHdr = true;
        hdr = '<div class="detail-group-hdr won-hdr">🏆 Won ' + winCount + '</div>';
      } else if (!n.won && !emittedNomHdr) {
        emittedNomHdr = true;
        hdr = '<div class="detail-group-hdr">Also nominated ' + (refs.length - winCount) + '</div>';
      }
      const charHtml = n.character ? '<div class="nom-character">as ' + escapeHtml(n.character) + '</div>' : "";
      const episodeHtml = n.episode ? '<div class="nom-episode">"' + escapeHtml(n.episode) + '"</div>' : "";
      return hdr + '<div class="detail-nom-row">' +
        '<div class="nom-check' + (checked ? " checked" : "") + '" data-cat="' + escapeHtml(r.catId) + '" data-idx="' + r.idx + '">' + (checked ? "✓" : "") + '</div>' +
        '<div class="txt">' +
          '<div class="cat">' + cat.icon + ' ' + escapeHtml(cat.label) + '</div>' +
          '<div class="nom-text' + (checked ? " checked" : "") + (n.won ? " won" : "") + '">' + escapeHtml(n.display) + '</div>' + charHtml + episodeHtml +
          '<div class="nom-meta">' + pickButtonsHtml(r.catId, r.idx) + '</div>' +
        '</div>' +
      '</div>';
    }).join("");

    detail.innerHTML =
      '<div class="detail-head">' +
        '<span class="detail-poster-slot">' + posterHtmlFor(showTitle, "xl") + '</span>' +
        '<div style="flex:1; min-width:0;">' +
          '<h2>' + escapeHtml(showTitle) + '</h2>' +
          '<div class="detail-sub">' + refs.length + ' nomination' + (refs.length === 1 ? "" : "s") +
            (winCount ? ' · <span class="detail-wins">' + winCount + ' win' + (winCount === 1 ? "" : "s") + '</span>' : "") + '</div>' +
        '</div>' +
        '<div class="detail-close" id="detailClose">✕</div>' +
      '</div>' +
      '<div class="stream-section">' +
        '<div class="lbl">Where to watch</div>' +
        '<div id="streamArea"><span class="stream-empty">Loading…</span></div>' +
      '</div>' +
      '<button class="mark-all-btn' + (allChecked ? " done" : "") + '" id="markAllBtn">' + (allChecked ? "✓ All marked as seen" : "Mark all " + refs.length + " as seen") + '</button>' +
      '<div class="detail-noms">' + rowsHtml + '</div>';

    detail.querySelectorAll(".nom-check").forEach(el => {
      el.addEventListener("click", () => {
        const catId = el.getAttribute("data-cat");
        const idx = parseInt(el.getAttribute("data-idx"), 10);
        const newVal = !isChecked(catId, idx);
        if (newVal) {
          // Checking a nomination on cascades to every other nomination for
          // this show, same as checking it from the main category list.
          cascadeFilm(showTitle, true);
          render();
        } else {
          // Unchecking is single-entry only, so you can carve out "I haven't
          // actually seen this specific episode" without undoing the rest.
          setChecked(catId, idx, false);
          saveState();
          render();
          renderCatList();
          renderOverall();
          renderUpNext();
        }
      });
    });

    detail.querySelectorAll(".pick-btn").forEach(el => {
      el.addEventListener("click", () => {
        const catId = el.getAttribute("data-cat");
        const idx = parseInt(el.getAttribute("data-idx"), 10);
        const type = el.getAttribute("data-pick");
        if (type === "predicted") setPredicted(catId, idx); else setWanted(catId, idx);
        render();
        renderCatList();
        renderOverall();
      });
    });

    document.getElementById("markAllBtn").addEventListener("click", () => {
      cascadeFilm(showTitle, true);
      render();
    });

    document.getElementById("detailClose").addEventListener("click", closeDetail);

    fetchStreaming(showTitle).then(data => {
      const posterSlot = detail.querySelector(".detail-poster-slot");
      if (posterSlot) posterSlot.innerHTML = posterHtmlFor(showTitle, "xl");
      const area = document.getElementById("streamArea");
      if (!area) return;
      const chips = [];
      (data.flatrate || []).forEach(p => chips.push('<span class="provider-chip">▶ ' + escapeHtml(p) + '</span>'));
      (data.rent || []).forEach(p => chips.push('<span class="provider-chip">$ ' + escapeHtml(p) + ' (rent)</span>'));
      (data.buy || []).forEach(p => chips.push('<span class="provider-chip">$ ' + escapeHtml(p) + ' (buy)</span>'));
      if (chips.length === 0) {
        area.innerHTML = '<span class="stream-empty">No streaming info found.</span>';
      } else {
        area.innerHTML = '<div class="provider-chips">' + chips.join("") + '</div>' +
          (data.link ? '<a class="stream-link" href="' + escapeHtml(data.link) + '" target="_blank" rel="noopener">Open on JustWatch ›</a>' : "");
      }
    });
  }

  render();

, ["The Late Show With Stephen Colbert"]], ["Albertina Rizzo", 2, "Executive Producer, Writer", ["The Muppet Show"]], ["Christian Sprenger", 2, "Director of Photography, Producer", ["Widow's Bay"]], ["Noah Wyle", 2, "Actor, Executive Producer", ["The Pitt"]]];

function showTitleOf(display) {
  // Reuse the app's own title parser so report keys match SHOW_INDEX exactly.
  return extractFilm(display) || display.trim();
}

function buildReportData() {
  const wins = {};
  let totalAwards = 0;
  CATEGORIES.forEach(function (cat) {
    cat.nominees.forEach(function (n) {
      if (!n.won) return;
      totalAwards++;
      const show = showTitleOf(n.display);
      wins[show] = (wins[show] || 0) + 1;
    });
  });
  const shows = Object.keys(wins)
    .map(function (s) { return { show: s, count: wins[s], network: WINNER_NETWORKS[s] || "—" }; })
    .sort(function (a, b) { return b.count - a.count || a.show.localeCompare(b.show); });

  const netCounts = {};
  const netShows = {};
  shows.forEach(function (r) {
    netCounts[r.network] = (netCounts[r.network] || 0) + r.count;
    if (!netShows[r.network]) netShows[r.network] = [];
    netShows[r.network].push({ show: r.show, count: r.count });
  });
  const nets = Object.keys(netCounts)
    .map(function (n) { return { network: n, count: netCounts[n], shows: netShows[n] }; })
    .sort(function (a, b) { return b.count - a.count || a.network.localeCompare(b.network); });

  return { shows: shows, nets: nets, totalAwards: totalAwards };
}

const SPECIAL_AWARDS = [{"award": "Costumes For Variety, Nonfiction Or Reality Programming", "kind": "Juried — two awards presented", "note": "Not a nomination-based category, so these wins are excluded from the leaderboard above.", "winners": [{"name": "Grainne O'Sullivan + 5 more", "show": "The Masked Singer", "ep": "Premiere Part 1", "net": "FOX"}, {"name": "Sam Spector + 2 more", "show": "The Traitors", "ep": "The Black Banquet", "net": "Peacock"}]}, {"award": "Individual Achievement In Animation", "kind": "Juried — five awards presented", "note": "", "winners": [{"name": "Takashi Okazaki, Character Designer", "show": "Star Wars: Visions", "ep": "The Duel: Payback", "net": "Disney+"}, {"name": "David Krentz, Storyboard", "show": "Genndy Tartakovsky's Primal", "ep": "Kingdom Of Sorrow", "net": "Adult Swim"}, {"name": "Scott Wills, Art Direction", "show": "Genndy Tartakovsky's Primal", "ep": "Vengeance Of Death", "net": "Adult Swim"}, {"name": "Howard Chen, Background Design", "show": "The Mighty Nein", "ep": "Mote Of Possibility", "net": "Prime Video"}, {"name": "Uzoma Dunkwu, Character Design", "show": "Eyes Of Wakanda", "ep": "Into the Lion's Den", "net": "Disney+"}]}, {"award": "Innovation In Emerging Media Programming", "kind": "Juried", "note": "", "winners": [{"name": "TARGO — Victor Agulhon, Chloé Rochereuil", "show": "Crafting Crimes", "ep": null, "net": "Meta Quest"}]}, {"award": "Legacy Award", "kind": "Inaugural honor", "note": "Presented for generational impact on the television industry.", "winners": [{"name": null, "show": "I Love Lucy", "ep": null, "net": null}]}, {"award": "Bob Hope Humanitarian Award", "kind": "Honorary", "note": "Recognizing contributions to Parkinson's disease research and advocacy.", "winners": [{"name": "Michael J. Fox", "show": null, "ep": null, "net": null}]}];

function renderSpecialPanel() {
  const items = SPECIAL_AWARDS.map(function (a) {
    const wins = a.winners.map(function (w) {
      let main = w.name ? escapeHtml(w.name) : escapeHtml(w.show);
      let subBits = [];
      if (w.name && w.show) subBits.push(escapeHtml(w.show));
      if (w.ep) subBits.push('"' + escapeHtml(w.ep) + '"');
      if (w.net) subBits.push(escapeHtml(w.net));
      return '<div class="sp-win">' +
        '<span class="w-main">★ ' + main + '</span>' +
        (subBits.length ? '<span class="w-sub">' + subBits.join(" · ") + '</span>' : '') +
      '</div>';
    }).join("");
    return '<div class="sp-item">' +
      '<div><span class="sp-award">' + escapeHtml(a.award) + '</span>' +
      '<span class="sp-kind">' + escapeHtml(a.kind) + '</span></div>' +
      (a.note ? '<div class="sp-note">' + escapeHtml(a.note) + '</div>' : '') +
      wins +
    '</div>';
  }).join("");
  return '<div class="report-panel">' +
    '<h3>Special &amp; juried awards</h3>' +
    '<div class="panel-sub">Honors and juried awards presented outside the nomination-based categories</div>' +
    items +
  '</div>';
}

function renderReport() {
  const el = document.getElementById("reportView");
  if (!el) return;
  const d = buildReportData();
  const maxWin = d.shows.length ? d.shows[0].count : 1;
  const maxNet = d.nets.length ? d.nets[0].count : 1;

  const hero =
    '<div class="report-hero">' +
      '<h2>🏆 78th Emmy Awards — Results</h2>' +
      '<div class="sub">All three nights, September 5, 6 and 14, 2026</div>' +
      '<div class="report-stats">' +
        '<div class="report-stat"><div class="n">' + d.totalAwards + '</div><div class="l">Awards</div></div>' +
        '<div class="report-stat"><div class="n">' + d.shows.length + '</div><div class="l">Winning shows</div></div>' +
        '<div class="report-stat"><div class="n">' + d.nets.length + '</div><div class="l">Networks</div></div>' +
        '<div class="report-stat"><div class="n">' + CATEGORIES.reduce(function (s, c) { return s + c.nominees.length; }, 0) + '</div><div class="l">Nominations</div></div>' +
      '</div>' +
    '</div>';

  const lbRows = d.shows.map(function (r, i) {
    const w = Math.max(6, Math.round((r.count / maxWin) * 60));
    const clickable = !!SHOW_INDEX[r.show];
    return '<div class="lb-row' + (i < 3 ? ' lb-top' : '') + (clickable ? ' lb-click' : '') + '"' +
      (clickable ? ' data-show="' + escapeHtml(r.show) + '"' : '') + '>' +
      '<span class="lb-rank">' + (i + 1) + '</span>' +
      '<span class="lb-name">' + escapeHtml(r.show) + (clickable ? ' <span class="lb-chev">›</span>' : '') + '</span>' +
      '<span class="lb-net">' + escapeHtml(r.network) + '</span>' +
      '<span class="lb-bar" style="width:' + w + 'px;"></span>' +
      '<span class="lb-count">' + r.count + '</span>' +
    '</div>';
  }).join("");

  const leaderboard =
    '<div class="report-panel">' +
      '<h3>Awards leaderboard</h3>' +
      '<div class="panel-sub">Every show that won at least one Emmy</div>' +
      lbRows +
    '</div>';

  const netBlocks = d.nets.map(function (n, ni) {
    const showRows = n.shows.map(function (s) {
      const clickable = !!SHOW_INDEX[s.show];
      return '<div class="ns-row' + (clickable ? ' ns-click' : '') + '"' +
        (clickable ? ' data-show="' + escapeHtml(s.show) + '"' : '') + '>' +
        '<span class="ns-name">' + escapeHtml(s.show) + '</span>' +
        '<span class="ns-ct">' + s.count + '</span>' +
      '</div>';
    }).join("");
    return '<div class="net-block">' +
      '<div class="net-head" data-net="' + ni + '">' +
        '<span class="net-ct">' + n.count + '</span>' +
        '<span class="net-nm">' + escapeHtml(n.network) + '</span>' +
        '<span class="net-meta">' + n.shows.length + ' show' + (n.shows.length === 1 ? '' : 's') + '</span>' +
        '<span class="net-chev">▾</span>' +
      '</div>' +
      '<div class="net-body" id="netBody' + ni + '">' + showRows + '</div>' +
    '</div>';
  }).join("");

  const networkPanel =
    '<div class="report-panel">' +
      '<h3>Network breakdown</h3>' +
      '<div class="panel-sub">Tap a network to see which of its shows won</div>' +
      netBlocks +
    '</div>';

  const indRows = MULTI_AWARD_INDIVIDUALS.map(function (p) {
    const shows = (p[3] || []).map(function (s) {
      const clickable = !!SHOW_INDEX[s];
      return '<span class="ind-show' + (clickable ? ' ind-click' : '') + '"' +
        (clickable ? ' data-show="' + escapeHtml(s) + '"' : '') + '>' + escapeHtml(s) + '</span>';
    }).join('<span class="ind-sep">·</span>');
    return '<div class="ind-row">' +
      '<span class="ind-ct">' + p[1] + '×</span>' +
      '<span class="ind-body">' +
        '<span class="ind-nm">' + escapeHtml(p[0]) + '</span>' +
        '<span class="ind-cr">' + escapeHtml(p[2]) + '</span>' +
        (shows ? '<span class="ind-shows">' + shows + '</span>' : '') +
      '</span>' +
    '</div>';
  }).join("");

  const indPanel =
    '<div class="report-panel">' +
      '<h3>Individuals with multiple awards</h3>' +
      '<div class="panel-sub">Winners of two or more Emmys across all three nights</div>' +
      indRows +
    '</div>';

  const foot = '<div class="report-foot">Source: Television Academy official winners releases.<br>' +
    'Leaderboard and network totals cover the 117 nomination-based categories. '+
    'Juried and honorary awards are listed separately below and are not counted in those totals.</div>';

  el.innerHTML = hero + leaderboard + networkPanel + indPanel + renderSpecialPanel() + foot;

  // Delegated clicks: open the existing show card, toggle network groups.
  el.onclick = function (ev) {
    const showEl = ev.target.closest("[data-show]");
    if (showEl) {
      const title = showEl.getAttribute("data-show");
      if (SHOW_INDEX[title]) openDetail(title);
      return;
    }
    const head = ev.target.closest(".net-head");
    if (head) {
      const body = document.getElementById("netBody" + head.getAttribute("data-net"));
      if (body) {
        const open = body.classList.toggle("open");
        head.classList.toggle("open", open);
      }
    }
  };
}

let reportMode = false;
function setReportMode(on, skipScroll) {
  reportMode = on;
  const rv = document.getElementById("reportView");
  const cl = document.getElementById("catList");
  const es = document.getElementById("emptyState");
  const lc = document.getElementById("listControls");
  // Hide only the tracker-specific blocks — the app title stays put in both views.
  const overall = document.querySelector(".overall");
  const upnext = document.getElementById("upnextSection");
  const segL = document.getElementById("modeList");
  const segR = document.getElementById("modeReport");

  if (on) renderReport();
  if (rv) rv.style.display = on ? "block" : "none";
  if (cl) cl.style.display = on ? "none" : "";
  if (es && on) es.style.display = "none";
  if (lc) lc.style.display = on ? "none" : "";
  if (overall) overall.style.display = on ? "none" : "";
  if (upnext) upnext.style.display = on ? "none" : "";

  if (segL) { segL.classList.toggle("active", !on); segL.setAttribute("aria-selected", String(!on)); }
  if (segR) { segR.classList.toggle("active", on);  segR.setAttribute("aria-selected", String(on)); }

  try { localStorage.setItem("emmyViewMode", on ? "report" : "list"); } catch (e) {}
  if (!on) renderAll();
  if (!skipScroll) window.scrollTo(0, 0);
}
